name: moonstone-first-boot

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: Reuse an xnu-kernel artifact from a previous workflow run
        default: ""
  push:
    branches: [moonstone]
    paths:
      - ".github/workflows/moonstone-first-boot.yml"
      - ".github/workflows/xnu.yml"
      - "shim/**"
      - "tools/mkadt.py"
      - "tools/mkboot.sh"
      - "tools/mkbootimg_v3.py"
      - "tools/mkinit.py"
      - "tools/mkpayload.py"
      - "tools/sweet-init.S"
      - "xnu/patches/**"

concurrency:
  group: moonstone-first-boot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    if: ${{ inputs.kernel_run_id == '' }}
    uses: ./.github/workflows/xnu.yml

  package:
    needs: kernel
    if: ${{ always() && (needs.kernel.result == 'success' || (inputs.kernel_run_id != '' && needs.kernel.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Download kernel from this run
        if: ${{ inputs.kernel_run_id == '' }}
        uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: xnu/out

      - name: Download kernel from an earlier run
        if: ${{ inputs.kernel_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.kernel_run_id }}
          REPO: ${{ github.repository }}
        run: gh run download "$RUN_ID" -R "$REPO" -n xnu-kernel -D xnu/out

      - name: Install shim build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu clang cpio gcc-aarch64-linux-gnu

      - name: Build boot and userspace-smoke candidates
        run: |
          set -euo pipefail
          chmod +x tools/*.sh shim/*.sh
          CMDLINE="debug=0xc cpus=1 keepsyms=1 -noprogress wdt=-1 sweetgpu=0 sweetfb_flip=0"
          CMDLINE="$CMDLINE" bash tools/mkboot.sh \
            xnu/out/kernel.development.sweet out/moonstone-first-boot.img
          clang -target arm64-apple-ios16.0 -c tools/sweet-init.S -o out/sweet-init.o
          python3 tools/mkinit.py out/sweet-init.o out/sweet-init.macho
          RAMDISK=out/sweet-init.macho CMDLINE="$CMDLINE rd=md0" \
            bash tools/mkboot.sh \
            xnu/out/kernel.development.sweet out/moonstone-userspace-smoke.img
          {
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            sha256sum out/moonstone-first-boot.img out/moonstone-first-boot-v4.img \
              out/moonstone-userspace-smoke.img out/moonstone-userspace-smoke-v4.img
          } | tee out/moonstone-first-boot-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: moonstone-first-boot
          path: |
            out/moonstone-first-boot.img
            out/moonstone-first-boot-v4.img
            out/moonstone-userspace-smoke.img
            out/moonstone-userspace-smoke-v4.img
            out/moonstone-first-boot-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
